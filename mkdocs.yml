site_name: Yiyang Tan
site_description: Personal site, research notes, and writing by Yiyang Tan.
site_url: https://tanngent2005.github.io/
site_author: Yiyang Tan

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - assets/css/writing.css

nav:
  - Writing:
      - Overview: blog/index.md
  - Notes:
      - Overview: notes/index.md
  - About: about.md

copyright: Copyright &copy; 2026 Yiyang Tan
